<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>המשפחה של סול - שיעור + פסנתר</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --white-w: 50px; --black-w: 25px;
            --modern-hi: #454b54; --modern-lo: #1b1e23; --teal: #6fd6c9; --gold: #e0a83f;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none !important;
            -webkit-touch-callout: none;
            font-family: Arial, sans-serif;
        }
        #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* Invisible full-screen tap catcher, not a visible "click to start"
           prompt — browsers (iOS Safari especially) still require a real
           user gesture before audio can play at all, so this stays in the
           DOM to guarantee that first tap is captured, it just no longer
           looks like a separate screen the child has to get past. */
        #start-screen { position: fixed; inset: 0; background: transparent; z-index: 100; cursor: pointer; }

        /* Pilot: a way back to Sol's home portal, always reachable — sits
           above even the start-screen tap-catcher (higher z-index) so a
           child/parent can leave immediately without first having to "start"
           the lesson. Fixed to the viewport, not the layout, so it never
           competes with the piano for width. */
        #home-btn {
            position: fixed;
            right: 12px;
            top: 38%;
            transform: translateY(-50%);
            z-index: 101;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            touch-action: auto;
        }

        @media (max-width: 640px) {
            /* Below the mode-bar row (not overlapping it) — on this lesson
               the row's own buttons can render wide enough on a real phone
               to reach the same corner the button used to float in. */
            #home-btn { top: 64px; right: 6px; gap: 3px; transform: none; }
        }

        #video-wrap { flex: 1 1 auto; min-height: 0; background: #000; touch-action: auto; transition: flex-basis 0.25s ease; }
        #video-wrap iframe { width: 100%; height: 100%; border: 0; touch-action: auto; }
        /* Practice mode: the video shrinks to a quiet strip instead of
           disappearing outright — the song keeps playing (timing + audio
           reference), but it stops competing visually with the falling
           notes for the child's attention. */
        /* This lesson has no watch mode — mode is locked to 'practice' on
           load (see setMode('practice') below) — so the video never needs
           to be seen at all. It's kept in the DOM at a hair's-breadth size
           (not display:none) purely so iOS doesn't suspend its audio, since
           that audio is still the practice timing/reference track. */
        #video-wrap.mini { flex: 0 0 2px; opacity: 0; }
        #video-wrap.mini iframe { pointer-events: none; }

        #mode-bar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #1a1a1a;
            touch-action: auto;
        }
        .mode-btn {
            touch-action: auto;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 9px 20px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: #262626;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
        }
        .mode-btn.active { background: var(--teal); color: #0a1210; border-color: var(--teal); font-weight: bold; }

        #speed-bar {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            background: #1a1a1a;
            touch-action: auto;
        }
        .speed-step-btn {
            touch-action: auto;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            font-family: Arial, sans-serif;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        .speed-step-btn:active { background: #555; }
        /* Bigger than the +/- speed steps — it was getting lost next to
           them, and it's the button that turns into "play again" at the
           end of the song, so it deserves to actually be noticed. */
        #play-pause {
            width: 54px;
            height: 54px;
            font-size: 26px;
        }
        #speed-reset {
            touch-action: auto;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #333;
            color: #fff;
            cursor: pointer;
            min-width: 90px;
        }
        #speed-reset.is-normal { background: #ffeb3b; color: #000; font-weight: bold; }

        #piano-container {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 1.5vh 0;
            box-sizing: border-box;
            touch-action: none !important;
        }
        /* Grid instead of flex: two equal empty side columns keep the
           cabinet truly centered on the page regardless of content width. */
        #rig {
            display: grid;
            grid-template-columns: auto;
            align-items: end;
            justify-content: center;
            gap: 16px;
            width: 100%;
            overflow-x: auto;
            padding: 0 8px;
        }
        #cabinet {
            flex-shrink: 0;
            width: fit-content;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, var(--modern-hi) 0%, var(--modern-lo) 100%);
            border-radius: 14px;
            padding: 12px 12px 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 10px 26px rgba(0,0,0,0.45);
        }
        #cabinet-lip {
            flex: 0 0 auto;
            height: 4px; border-radius: 3px; margin-bottom: 10px;
            background: linear-gradient(90deg, var(--teal), #bdf2ea, var(--teal));
            box-shadow: 0 0 6px rgba(111,214,201,0.6);
        }
        #keywell {
            position: relative;
            background: linear-gradient(180deg, #100f13 0%, var(--modern-lo) 100%);
            border-radius: 10px 10px 0 0;
            padding: 10px 10px 0;
            display: flex; flex-direction: column; align-items: stretch;
        }
        /* Shown briefly whenever practice mode starts, so the "press when
           it reaches the line" rule is explained instead of assumed. */
        #practice-hint {
            position: absolute;
            top: 6px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(111,214,201,0.4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 16px;
            white-space: nowrap;
            z-index: 60;
            opacity: 1;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #practice-hint.hidden { opacity: 0; }
        /* Note lane: sits directly above the keys (not up near the video),
           so a child's eyes barely have to move between "what's coming"
           and "where to press." Column widths mirror the white keys below
           exactly, via the same --white-w variable. */
        #note-lane {
            position: relative;
            height: var(--lane-h, 0px);
            display: flex;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.32));
            margin-bottom: 6px;
            transition: height 0.2s ease;
        }
        #note-lane.hidden { height: 0 !important; margin-bottom: 0; }
        .note-lane-col {
            position: relative;
            width: var(--white-w);
            height: 100%;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .note-lane-col:last-child { border-right: none; }
        /* Flush with the keys — tinted a greener turquoise than the
           cabinet-lip strip so it still reads as its own distinct
           "special LED" rather than blending into the lane background. */
        #note-lane-hitline {
            position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, #29c98f, #baf7d9, #29c98f);
            box-shadow: 0 0 9px rgba(41,201,143,0.8), inset 0 0 2px rgba(255,255,255,0.6);
        }
        .falling-note {
            position: absolute;
            top: 0;
            left: 50%;
            width: calc(var(--white-w) * 0.6);
            height: calc(var(--white-w) * 0.6);
            transform: translateX(-50%);
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(0,0,0,0.85);
            /* Soft white LED-style halo around the ring, on top of the
               grounding drop shadow. */
            box-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 10px 2px rgba(255,255,255,0.65);
            background: #333;
            pointer-events: none;
        }
        /* object-fit: contain (not cover) — cover was cropping into a
           mostly-transparent margin around the character at random,
           different amounts every time, which read as "unstable." contain
           always shows the whole figure, consistently framed. */
        .falling-note img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* "אני רוצה לנסות לבד" — an alternate, self-paced view: instead of
           notes falling with the video/audio driving the timing, every note
           in the song sits laid out left-to-right on a music staff, at its
           real pitch height, and the child works through them at their own
           pace with no clock pushing them forward. */
        #solo-btn {
            touch-action: auto;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 9px 20px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: #262626;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            white-space: nowrap;
        }
        #solo-btn.active { background: var(--teal); color: #0a1210; border-color: var(--teal); font-weight: bold; }

        /* "ככה השיר נשמע" — a short reference clip of Hani playing+singing
           the taught segment, so a child who's pressing the right notes but
           can't recognize the tune in them has somewhere to actually hear it,
           in the scale she played it in. Plays start-to-finish on its own —
           never layered under the child's own playing — so the piano goes
           inert for that moment instead of inviting a confusing double-take. */
        #melody-btn {
            touch-action: auto;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 9px 20px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: #262626;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }
        #melody-btn.playing { background: var(--gold); color: #2a1c00; border-color: var(--gold); font-weight: bold; }
        .piano.melody-playing { pointer-events: none; opacity: 0.55; }
        #staff-wrap {
            position: relative;
            /* Tied to the piano's own width (7 white keys) — without this,
               #cabinet's width:fit-content let the staff's full, unclipped
               content (however many notes long) stretch the whole cabinet
               to match it instead of scrolling inside a bounded box, which
               on a narrow phone blew the piano itself far past the keys'
               own real, already-correct width. */
            width: calc(var(--white-w) * 7);
            height: var(--staff-h, 150px);
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.32));
            margin-bottom: 6px;
            display: none;
        }
        #staff-wrap.active { display: block; }
        #staff-inner { position: relative; height: 100%; }
        .staff-line {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: rgba(255,255,255,0.32);
        }
        .staff-ledger {
            position: absolute;
            height: 2px;
            background: rgba(255,255,255,0.32);
            transform: translate(-50%, -50%);
        }
        .staff-note {
            position: absolute;
            transform: translate(-50%, -50%);
        }
        .staff-note-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(0,0,0,0.85);
            background: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 10px 2px rgba(255,255,255,0.55);
        }
        .staff-note-avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }
        /* Already played correctly — lights up teal and stays lit, so the
           child can see their progress through the whole line at a glance.
           No "play this next" hint on purpose — the point of this mode is
           reading the staff independently, not being told what's next. */
        .staff-note.done .staff-note-avatar {
            border-color: var(--teal);
            box-shadow: 0 0 12px 4px rgba(111,214,201,0.9);
        }
        /* Correct-in-time press: pop like a bubble — a quick anticipatory
           squash, then a fast burst-and-vanish — instead of a plain fade. */
        @keyframes bubble-pop {
            0%   { transform: translateX(-50%) scale(1); opacity: 1; }
            30%  { transform: translateX(-50%) scale(0.85); opacity: 1; }
            100% { transform: translateX(-50%) scale(2.1); opacity: 0; }
        }
        .falling-note.hit { animation: bubble-pop 0.3s ease-out forwards; }

        .piano {
            align-self: center;
            display: flex;
            position: relative;
            direction: ltr;
            height: var(--key-h, 220px);
            touch-action: none !important;
        }

        .key {
            position: relative;
            border: 1px solid #000;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 6px;
            z-index: 10;
            touch-action: none !important;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .white-key { width: var(--white-w); height: 100%; background-color: white; border-radius: 0 0 5px 5px; }

        /* "Fills up like a glass of water" — rises a notch with every
           correct-in-time press, behind the character but above the key's
           own background, so by the end of the song each key shows its
           own little results bar. */
        .key-fill {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 0%;
            z-index: -1;
            pointer-events: none;
            border-radius: 0 0 5px 5px;
            background: linear-gradient(180deg, rgba(130,226,255,0.4), rgba(41,150,201,0.75));
            transition: height 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }
        .key-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: rgba(255,255,255,0.85);
            box-shadow: 0 0 6px rgba(255,255,255,0.85);
            transform-origin: 50% 50%;
        }
        /* A brief splash right when the level rises, then it settles and
           stays still — a constant infinite wobble was too much motion to
           have sitting there the whole song, distracting from the actual
           falling notes. */
        .key-fill.pouring::after {
            animation: water-sway 0.9s ease-out 1;
        }
        @keyframes water-sway {
            0%   { transform: rotate(0deg) translateY(0); }
            20%  { transform: rotate(-6deg) translateY(0); }
            45%  { transform: rotate(4deg) translateY(-2px); }
            70%  { transform: rotate(-2deg) translateY(0); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .key-fill.pouring::after { animation: none; }
        }

        .black-key {
            width: var(--black-w);
            height: 45%;
            background-color: #333;
            z-index: 30;
            margin-left: calc(var(--black-w) / -2);
            margin-right: calc(var(--black-w) / -2);
            border-radius: 0 0 3px 3px;
        }

        .key.active { background-color: #ffeb3b !important; }
        .key.due { box-shadow: inset 0 0 0 5px #4caf50; }
        .key.correct-flash {
            background-color: #ffab00 !important;
            box-shadow: 0 0 10px 2px rgba(255, 171, 0, 0.45);
            transition: background-color 0.25s ease-out, box-shadow 0.25s ease-out;
        }
        @keyframes star-pop {
            0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            40%  { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
        }
        .star-pop {
            position: absolute;
            top: 35%;
            left: 50%;
            font-size: 28px;
            pointer-events: none;
            animation: star-pop 0.55s ease-out forwards;
            z-index: 41;
        }

        .character-img {
            width: 80%;
            margin-bottom: 4px;
            pointer-events: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        #calib-panel {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            /* Higher than #start-screen (100) — if that overlay ever fails to
               dismiss (e.g. Tone.js/audio setup stalls), the calibration
               buttons underneath must still be reachable, since calibration
               only needs the video player, not the piano audio. */
            z-index: 200;
            background: rgba(0,0,0,0.75);
            border-radius: 10px;
            padding: 8px;
            max-width: 220px;
            touch-action: auto;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #calib-panel button {
            touch-action: auto;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            margin: 2px;
        }
        #calib-mark { background: #ffeb3b; color: #000; font-weight: bold; width: 100%; padding: 12px; font-size: 16px; }
        #calib-undo { background: #555; color: #fff; }
        #calib-clear { background: #555; color: #fff; }
        #calib-copy { background: #4caf50; color: #fff; }
        #calib-list {
            touch-action: auto;
            max-height: 110px;
            overflow-y: auto;
            font-size: 12px;
            margin-top: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 4px;
            direction: ltr;
            text-align: left;
        }
        #calib-copy-box {
            display: none;
            touch-action: auto;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            font-size: 12px;
            direction: ltr;
            text-align: left;
            resize: none;
            border-radius: 6px;
            border: 1px solid #4caf50;
            padding: 4px;
        }
        /* ============ משכי תווים ב"אני רוצה לנסות לבד" ============
           תו ארוך נדרש להחזקה במקום לנגיעה: העיגול מתמלא מים כל עוד
           האצבע למטה, וצלצול מסמן שהוא מלא. שחרור מוקדם אינו טעות -
           המים נשפכים חזרה וזו הזדמנות לנסות שוב. */
        .staff-note-avatar { position: relative; }
        .note-water { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
        .note-water svg { width: 100%; height: 100%; display: block; }
        /* בזמן החזקה טבעת זהב, וכשמלא טבעת טורקיז. שום דבר לא גדל ולא זז:
           האצבע על הקליד, ותנועה על המסך באמצע החזקה מבלבלת. */
        .staff-note.holding .staff-note-avatar {
            border-color: #e0a83f;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,214,102,0.5);
        }
        .staff-note.hold-full .staff-note-avatar {
            box-shadow: 0 0 0 7px rgba(111,214,201,0.45), 0 0 14px 4px rgba(111,214,201,0.9);
        }
        /* אצבע שנחה שנייה שלמה על תמונת הדמות גורמת ל-iOS לנסות לגרור
           אותה. עד עכשיו לא היו כאן החזקות, ולכן זה לא צץ. */
        .key img, .staff-note img { -webkit-user-drag: none; user-drag: none; }
        /* ================= סוף התוספת ================= */
    </style>
<style>
/* ---------- Sol home button (unified turquoise) ---------- */
.sol-home-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 101;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #17A79B;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.sol-home-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45); }
.sol-home-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
.sol-home-btn svg { width: 26px; height: 26px; }
@media (max-width: 640px) {
    .sol-home-btn { width: 44px; height: 44px; top: 8px; left: 8px; }
    .sol-home-btn svg { width: 22px; height: 22px; }
}
@media (prefers-reduced-motion: reduce) {
    .sol-home-btn { transition: none; }
    .sol-home-btn:hover { transform: none; }
}

/* On a phone the fixed home button sits over this row — reserve its corner
   rather than shrinking anything. */
@media (max-width: 640px) { #mode-bar { padding-left: 60px; } }
</style>
</head>
<body>

<div id="app">
    <div id="video-wrap">
        <div id="lesson-video"></div>
    </div>
    <audio id="melody-audio" src="melody.mp3" preload="none"></audio>
    <div id="mode-bar">
        <!-- This song has no watch-along video of Hani narrating — it opens
             straight into practice, so the watch/practice choice is hidden
             (not removed from the DOM, so the shared JS logic stays intact). -->
        <button id="mode-watch" class="mode-btn active" style="display:none">👀 צפייה</button>
        <button id="mode-practice" class="mode-btn" style="display:none">🎹 תרגול</button>
        <button id="melody-btn">🎵 ככה השיר נשמע</button>
        <button id="solo-btn">אני רוצה לנסות לבד</button>
    </div>
    <div id="speed-bar">
        <button id="play-pause" class="speed-step-btn">▶</button>
        <button id="speed-minus" class="speed-step-btn">－</button>
        <button id="speed-reset" class="is-normal">מהירות</button>
        <button id="speed-plus" class="speed-step-btn">＋</button>
    </div>
    <div id="piano-container">
        <div id="rig">
            <div id="cabinet">
                <div id="cabinet-lip"></div>
                <div id="keywell">
                    <div id="practice-hint" class="hidden">לחצו על הקליד כשהדמות מגיעה לקו 👇</div>
                    <div id="note-lane" class="hidden"></div>
                    <div id="staff-wrap"><div id="staff-inner"></div></div>
                    <div class="piano" id="piano"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="start-screen"></div>

<a class="sol-home-btn" href="https://portal.smoove.io/gsbmtbnbbf1yd87kbofd1/Category?category=qqb" target="_top" aria-label="חזרה למסך הבית">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11l9-8 9 8" />
        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
    </svg>
</a>

<div id="calib-panel">
    <button id="calib-mark">סמן עכשיו ▶</button>
    <div style="display:flex; justify-content:space-between;">
        <button id="calib-undo">בטל אחרון</button>
        <button id="calib-clear">נקה הכל</button>
    </div>
    <button id="calib-copy" style="width:100%">העתק תוצאות</button>
    <textarea id="calib-copy-box" readonly rows="3"></textarea>
    <div id="calib-list"></div>
</div>

<script>
    const startScreen = document.getElementById('start-screen');
    const pianoElement = document.getElementById('piano');
    const pianoContainer = document.getElementById('piano-container');
    const videoWrap = document.getElementById('video-wrap');
    const noteLane = document.getElementById('note-lane');
    const modeWatchBtn = document.getElementById('mode-watch');
    const modePracticeBtn = document.getElementById('mode-practice');
    const practiceHint = document.getElementById('practice-hint');
    let hintTimeout = null;
    function showPracticeHint() {
        practiceHint.classList.remove('hidden');
        clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => practiceHint.classList.add('hidden'), 4500);
    }
    function dismissPracticeHint() {
        practiceHint.classList.add('hidden');
        clearTimeout(hintTimeout);
    }

    // Pilot: two modes instead of one screen that tries to do both jobs.
    // "צפייה" (watch) — video full-size, piano free to noodle on but with
    // no timing pressure, since nothing is being graded while just watching.
    // "תרגול" (practice) — video shrinks to a quiet strip (song keeps
    // playing for timing/audio), and the falling-note lane above the keys
    // becomes the main thing to look at, so eyes don't have to jump
    // between a video up top and a keyboard down below.
    let mode = 'watch';
    function setMode(next) {
        mode = next;
        videoWrap.classList.toggle('mini', mode === 'practice');
        noteLane.classList.toggle('hidden', mode !== 'practice');
        modeWatchBtn.classList.toggle('active', mode === 'watch');
        modePracticeBtn.classList.toggle('active', mode === 'practice');
        Object.values(keyFillEls).forEach(el => { el.style.opacity = mode === 'practice' ? '1' : '0'; });
        if (mode === 'watch') {
            activeTiles.forEach(tile => tile.remove());
            activeTiles.clear();
            dismissPracticeHint();
        } else {
            showPracticeHint();
        }
        sizeKeys();
    }
    modeWatchBtn.addEventListener('click', () => setMode('watch'));
    modePracticeBtn.addEventListener('click', () => setMode('practice'));

    // --- "אני רוצה לנסות לבד" — self-paced staff view. Every note in the
    // song is laid out once, left to right in order, at its real pitch
    // height on a 5-line staff (do sits on a ledger line below the staff,
    // same as real sheet music). No falling animation, no audio timing —
    // the child just works through the sequence at their own pace.
    let soloMode = false;
    let soloIdx = 0;
    const soloBtn = document.getElementById('solo-btn');
    const staffWrap = document.getElementById('staff-wrap');
    const staffInner = document.getElementById('staff-inner');
    const staffNoteEls = [];
    const staffWaterEls = [];
    const STAFF_PITCH_Y = { C: 60, D: 54, E: 48, F: 42, G: 36, A: 30, B: 24 };

    function buildStaff() {
        staffInner.innerHTML = '';
        staffNoteEls.length = 0;
        staffWaterEls.length = 0;
        const wrapH = staffWrap.clientHeight || 150;
        const whiteWpx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--white-w')) || 50;
        // Note circles are normally sized off key width, but on a wide
        // landscape screen that can come out bigger than the wrap is tall —
        // cap them to what actually fits, so they never overlap/clip
        // instead of just reading the notation smaller.
        const idealNoteSize = whiteWpx * 0.5;
        const maxNoteSizeForHeight = Math.max(16, (wrapH - 16) / 3);
        const noteSize = Math.min(idealNoteSize, maxNoteSizeForHeight);
        // The 5 staff lines + ledger span 36px (STAFF_PITCH_Y's own range),
        // plus each note's own radius poking past the top/bottom line.
        const offsetY = Math.max(10, (wrapH - (36 + noteSize)) / 2);
        [0, 12, 24, 36, 48].forEach(y => {
            const line = document.createElement('div');
            line.className = 'staff-line';
            line.style.top = (y + offsetY) + 'px';
            staffInner.appendChild(line);
        });
        const spacing = noteSize * 1.35;
        staffInner.style.width = (songNotes.length * spacing + 40) + 'px';
        songNotes.forEach((n, i) => {
            const letter = n.note[0];
            const y = STAFF_PITCH_Y[letter] + offsetY;
            const x = 30 + i * spacing;
            if (letter === 'C') {
                const ledger = document.createElement('div');
                ledger.className = 'staff-ledger';
                ledger.style.left = x + 'px';
                ledger.style.top = y + 'px';
                ledger.style.width = (noteSize * 1.3) + 'px';
                staffInner.appendChild(ledger);
            }
            const note = document.createElement('div');
            note.className = 'staff-note';
            if (i < soloIdx) note.classList.add('done');
            note.style.left = x + 'px';
            note.style.top = y + 'px';
            note.style.width = noteSize + 'px';
            note.style.height = noteSize + 'px';
            const avatar = document.createElement('div');
            avatar.className = 'staff-note-avatar';
            const img = document.createElement('img');
            img.src = characterImages[noteLetterOrder.indexOf(letter)] || '';
            img.draggable = false;
            avatar.appendChild(img);
            // המים יושבים מעל הדמות בשקיפות: מתחתיה הם היו נעלמים,
            // כי לרקע של התמונות אין שקיפות.
            const water = document.createElement('div');
            water.className = 'note-water';
            water.innerHTML = waterSvg('0.72');
            avatar.appendChild(water);
            staffWaterEls.push(water);
            note.appendChild(avatar);
            staffInner.appendChild(note);
            staffNoteEls.push(note);
        });
        updateStaffScroll();
    }

    // ===================== משכי תווים =====================
    const WAVE_TOP  = "M-100,0 q25,-6 50,0 t50,0 t50,0 t50,0 t50,0 t50,0";
    const WAVE_PATH = WAVE_TOP + " V115 H-100 Z";
    function waterSvg(opacity) {
        return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
            '<path class="wv" fill="#0F8C82" fill-opacity="' + opacity + '" d="' + WAVE_PATH + '" transform="translate(0,100)"></path>' +
            '<path class="wv" fill="none" stroke="#BFF6EE" stroke-width="6" stroke-opacity="0.95" d="' + WAVE_TOP + '" transform="translate(0,100)"></path>' +
            '</svg>';
    }
    function setWater(el, p) {
        if (!el) return;
        // הגל מתנדנד קלות בזמן שהוא עולה, כדי שייראה כמו מים ולא כמו פס
        const t = 'translate(' + (Math.sin(Date.now() / 240) * 6) + ',' + ((1 - p) * 100) + ')';
        el.querySelectorAll('.wv').forEach(wv => wv.setAttribute('transform', t));
    }
    function paintNoteFill(idx, p) { setWater(staffWaterEls[idx], p); }

    let soloHold = null;
    let drainSeq = 0;
    let chimeSynth = null;

    function holdChime() {
        try {
            if (!chimeSynth) {
                chimeSynth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.005, decay: 0.4, sustain: 0, release: 0.1 }
                }).toDestination();
                chimeSynth.volume.value = -14;
            }
            chimeSynth.triggerAttackRelease('C7', 0.25);
        } catch (err) {}
    }

    function completeSoloNote(idx, key) {
        fillKey(songNotes[idx].note);
        key.classList.add('correct-flash');
        const star = document.createElement('div');
        star.className = 'star-pop';
        star.textContent = '⭐';
        key.appendChild(star);
        setTimeout(() => {
            key.classList.remove('correct-flash');
            star.remove();
        }, 550);
        paintNoteFill(idx, 1);
        markStaffNoteDone(idx);
        soloIdx++;
        updateStaffScroll();
    }

    function startHold(idx, key) {
        if (soloHold) return;
        drainSeq++;
        soloHold = { idx: idx, key: key, full: false, t0: Date.now(), need: songNotes[idx].dur * 1000 };
        const el = staffNoteEls[idx];
        if (el) el.classList.add('holding');
        holdTick();
    }

    function holdTick() {
        if (!soloHold) return;
        const p = Math.min(1, (Date.now() - soloHold.t0) / soloHold.need);
        paintNoteFill(soloHold.idx, p);
        if (p >= 1 && !soloHold.full) {
            soloHold.full = true;
            const el = staffNoteEls[soloHold.idx];
            if (el) el.classList.add('hold-full');
            holdChime();
        }
        soloHold.raf = requestAnimationFrame(holdTick);
    }

    function releaseHold(key) {
        if (!soloHold || soloHold.key !== key) return;
        const h = soloHold;
        soloHold = null;
        cancelAnimationFrame(h.raf);
        const el = staffNoteEls[h.idx];
        if (el) el.classList.remove('holding', 'hold-full');
        const p = Math.min(1, (Date.now() - h.t0) / h.need);
        if (p >= HOLD_TOL) completeSoloNote(h.idx, h.key);
        else drainNote(h.idx, p);
    }

    // שחרור מוקדם אינו טעות - המים נשפכים החוצה ומנסים שוב.
    function drainNote(idx, from) {
        const t0 = Date.now();
        const mine = ++drainSeq;
        (function step() {
            if (mine !== drainSeq) return;
            const q = Math.min(1, (Date.now() - t0) / 280);
            paintNoteFill(idx, from * (1 - q));
            if (q < 1) requestAnimationFrame(step);
        })();
    }

    function cancelHold() {
        if (!soloHold) return;
        const h = soloHold;
        soloHold = null;
        cancelAnimationFrame(h.raf);
        const el = staffNoteEls[h.idx];
        if (el) el.classList.remove('holding', 'hold-full');
        paintNoteFill(h.idx, 0);
    }
    // =================== סוף התוספת ===================

    function markStaffNoteDone(index) {
        const el = staffNoteEls[index];
        if (el) el.classList.add('done');
    }

    function updateStaffScroll() {
        const cur = staffNoteEls[soloIdx];
        if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }

    soloBtn.addEventListener('click', () => {
        cancelHold();
        soloMode = !soloMode;
        soloBtn.classList.toggle('active', soloMode);
        soloBtn.textContent = soloMode ? 'חזרה לתרגול הרגיל' : 'אני רוצה לנסות לבד';
        if (soloMode) {
            if (player && player.pauseVideo) player.pauseVideo();
            isPaused = true;
            playPauseBtn.textContent = '▶';
            noteLane.classList.add('hidden');
            staffWrap.classList.add('active');
            soloIdx = 0;
            staffNoteEls.forEach(el => el.classList.remove('done'));
            buildStaff();
            dismissPracticeHint();
            // Leftover state from the timed practice mode shouldn't carry
            // into a fresh "לנסות לבד" attempt.
            Object.values(keyByNote).forEach(el => el.classList.remove('due'));
            resetKeyFills();
            activeTiles.forEach(tile => tile.remove());
            activeTiles.clear();
        } else {
            staffWrap.classList.remove('active');
            noteLane.classList.remove('hidden'); // this lesson is always in practice mode
        }
        sizeKeys();
    });

    // Calibration tool is dev-only: hidden from students, shown only when
    // building/checking a song's timing map via ?admin=1 in the URL.
    if (new URLSearchParams(location.search).get('admin') === '1') {
        document.getElementById('calib-panel').style.display = 'block';
    }

    // Real YouTube IFrame API (instead of one-way postMessage guesses) so we can
    // reliably read back the current playback time for the calibration tool below.
    let player = null;
    let pendingPlay = false;
    window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('lesson-video', {
            videoId: 'wV1enhokhAA',
            playerVars: { playsinline: 1, rel: 0 },
            events: {
                onReady: () => {
                    // This lesson's video is Hani's own playing, not singing —
                    // audible at the same time as the child's own piano it just
                    // reads as confusing noise, so it stays muted permanently
                    // (no toggle, nothing to opt into).
                    player.mute();
                    if (pendingPlay) player.playVideo();
                },
                onStateChange: (e) => {
                    // Once the song ends there was no way back in — flip
                    // the pause button into a "play again" state instead of
                    // leaving a dead, unresponsive-looking control.
                    if (e.data === YT.PlayerState.ENDED) {
                        isPaused = true;
                        playPauseBtn.textContent = '🔁';
                    }
                }
            }
        });
    };

    startScreen.addEventListener('click', async () => {
        await Tone.start();
        await reverb.ready;
        startScreen.style.display = 'none';
        console.log("Audio Context started");

        if (player && player.playVideo) player.playVideo();
        else pendingPlay = true;
        // עד הנגיעה הזו שום דבר לא התנגן, ולכן הכפתור פתח ב-▶.
        // רק כאן הוא הופך לכפתור עצירה אמיתי.
        playPauseBtn.textContent = '⏸';
        isPaused = false;
    });

    // Speed stepper: minus/plus move in 0.25 steps between 0.5x-1.5x,
    // the center button both shows the current speed and resets to normal.
    const speedSteps = [0.5, 0.75, 1, 1.25, 1.5];
    let speedIndex = 2; // 1x
    const speedMinusBtn = document.getElementById('speed-minus');
    const speedPlusBtn = document.getElementById('speed-plus');
    const speedResetBtn = document.getElementById('speed-reset');

    function applySpeed(index) {
        speedIndex = Math.max(0, Math.min(speedSteps.length - 1, index));
        const rate = speedSteps[speedIndex];
        if (player && player.setPlaybackRate) player.setPlaybackRate(rate);
        const isNormal = rate === 1;
        speedResetBtn.textContent = isNormal ? 'מהירות' : `×${rate}`;
        speedResetBtn.classList.toggle('is-normal', isNormal);
    }

    speedMinusBtn.addEventListener('click', () => applySpeed(speedIndex - 1));
    speedPlusBtn.addEventListener('click', () => applySpeed(speedIndex + 1));
    speedResetBtn.addEventListener('click', () => applySpeed(2));

    // Pause/resume — the falling notes and due-highlight are both driven
    // off player.getCurrentTime() every frame, so pausing the video just
    // naturally freezes them in place too; nothing extra needed for that.
    const playPauseBtn = document.getElementById('play-pause');
    let isPaused = false;
    playPauseBtn.addEventListener('click', () => {
        if (!player) return;
        if (player.getPlayerState && player.getPlayerState() === YT.PlayerState.ENDED) {
            // Song's over — this click means "play it again from the top,"
            // not "resume," so also reset the note-timing feedback state.
            player.seekTo(0);
            player.playVideo();
            songIdx = 0;
            songHit = false;
            resetKeyFills();
            isPaused = false;
            playPauseBtn.textContent = '⏸';
            return;
        }
        isPaused = !isPaused;
        if (isPaused) { player.pauseVideo(); playPauseBtn.textContent = '▶'; }
        else { player.playVideo(); playPauseBtn.textContent = '⏸'; }
    });

    // "ככה השיר נשמע" — plays start-to-finish on its own, never mixed with
    // the child's own playing, so the piano goes inert for that moment.
    const melodyBtn = document.getElementById('melody-btn');
    const melodyAudio = document.getElementById('melody-audio');
    melodyBtn.addEventListener('click', () => {
        if (melodyBtn.classList.contains('playing')) {
            // Tapping again mid-playback stops it early — nothing here
            // should force a full, uninterruptible listen.
            melodyAudio.pause();
            melodyBtn.classList.remove('playing');
            melodyBtn.textContent = '🎵 ככה השיר נשמע';
            pianoElement.classList.remove('melody-playing');
            return;
        }
        melodyBtn.classList.add('playing');
        melodyBtn.textContent = '⏹ עצירה';
        pianoElement.classList.add('melody-playing');
        if (player) player.pauseVideo();
        isPaused = true;
        playPauseBtn.textContent = '▶';
        melodyAudio.currentTime = 0;
        melodyAudio.play();
    });
    melodyAudio.addEventListener('ended', () => {
        melodyBtn.classList.remove('playing');
        melodyBtn.textContent = '🎵 ככה השיר נשמע';
        pianoElement.classList.remove('melody-playing');
    });

    // --- Calibration tool: tap "mark now" every time a character hits the green
    // line, and it logs the exact video timestamp. Not part of the kids' UI —
    // this is a dev tool for building a note-timing map for this song later.
    const calibMarks = [];
    const calibListEl = document.getElementById('calib-list');
    const calibMarkBtn = document.getElementById('calib-mark');
    const calibUndoBtn = document.getElementById('calib-undo');
    const calibClearBtn = document.getElementById('calib-clear');
    const calibCopyBtn = document.getElementById('calib-copy');

    function renderCalibList() {
        calibListEl.innerHTML = calibMarks
            .map((t, i) => `${i + 1}. ${t.toFixed(2)}s`)
            .join('<br>');
        calibListEl.scrollTop = calibListEl.scrollHeight;
    }

    calibMarkBtn.addEventListener('click', () => {
        if (!player || !player.getCurrentTime) return;
        calibMarks.push(player.getCurrentTime());
        renderCalibList();
    });
    calibUndoBtn.addEventListener('click', () => { calibMarks.pop(); renderCalibList(); });
    calibClearBtn.addEventListener('click', () => { calibMarks.length = 0; renderCalibList(); });
    const calibCopyBox = document.getElementById('calib-copy-box');
    calibCopyBtn.addEventListener('click', () => {
        const text = calibMarks.map(t => t.toFixed(2)).join(', ');
        // The Clipboard API silently fails in some mobile/embedded browser
        // contexts with no visible error — always show the text in a
        // selectable box too, so copying works no matter what, by hand if
        // the automatic copy didn't actually go through.
        calibCopyBox.value = text;
        calibCopyBox.style.display = 'block';
        calibCopyBox.focus();
        calibCopyBox.select();
        navigator.clipboard.writeText(text).then(() => {
            calibCopyBtn.textContent = 'הועתק! (או בחרי ידנית למטה)';
        }).catch(() => {
            calibCopyBtn.textContent = 'בחרי את הטקסט למטה ותעתיקי ידנית';
        });
        setTimeout(() => { calibCopyBtn.textContent = 'העתק תוצאות'; }, 2500);
    });

    // Note-timing feedback for "ארץ זבת חלב ודבש", built from Hani's calibration marks.
    const songTimes = [3.94, 5.32, 6.04, 6.82, 7.86, 8.65, 11.07, 11.89, 12.66, 13.56, 15.73, 17.08, 17.87, 18.61, 19.65, 20.46, 22.87, 23.72, 24.48, 25.43, 27.80, 29.02, 30.06, 31.04, 31.98, 33.01, 34.79, 35.67, 36.55, 37.68, 39.68, 40.95, 41.93, 42.91, 43.82, 44.88, 46.69, 47.64, 48.43, 49.51];
    const songLetters = ['D', 'D', 'C', 'C', 'D', 'D', 'D', 'E', 'C', 'D', 'D', 'D', 'C', 'C', 'D', 'D', 'D', 'E', 'C', 'D', 'G', 'A', 'F', 'F', 'F', 'F', 'F', 'G', 'E', 'F', 'G', 'A', 'F', 'F', 'F', 'F', 'F', 'G', 'E', 'D'];
    const songNotes = songTimes.map((t, i) => ({ time: t, note: songLetters[i] + '4' }));

    // --- אורך התו ---
    // הנתונים למעלה הם רגעי כניסה בלבד, בלי אורך. האורך נגזר מהמרווח עד
    // התו הבא. המספרים כאן חושבו מפיזור המרווחים של השיר הזה בלבד -
    // לכל שיר קצב אחר, והעתקה מאחר תיתן סיווג שגוי.
    const HOLD_MIN = 1.5;   // מתחת לזה נגיעה. מעל - החזקה.
    const DUR_CAP  = 1.9;   // תקרה: מרווח ארוך הוא תו ועוד שתיקה
    const LAST_DUR = 1.9;   // לתו האחרון אין מרווח אחריו
    const HOLD_TOL = 0.90;  // 90% מהאורך כבר נחשב מלא
    songNotes.forEach((n, i) => {
        const gap = i < songNotes.length - 1 ? songNotes[i + 1].time - n.time : LAST_DUR;
        n.dur = Math.min(gap, DUR_CAP);
        n.hold = n.dur >= HOLD_MIN;
    });

    // Per-key "fill" progress (idea: each correct-in-time press fills up
    // the key a little, like pouring water into a glass — by the end of
    // the song, how full each key got shows how well that note went).
    // Denominator is how many times that exact key is due across the
    // whole song; numerator is how many of those were hit correctly.
    const songNoteTotals = {};
    songNotes.forEach(n => { songNoteTotals[n.note] = (songNoteTotals[n.note] || 0) + 1; });
    const songNoteCorrect = {};
    const keyFillEls = {};
    function fillKey(note) {
        const total = songNoteTotals[note];
        const fillEl = keyFillEls[note];
        const keyEl = keyByNote[note];
        if (!total || !fillEl || !keyEl) return;
        songNoteCorrect[note] = (songNoteCorrect[note] || 0) + 1;
        const pct = Math.min(1, songNoteCorrect[note] / total);
        // Pixels, not a CSS percentage — sidesteps any ambiguity about
        // whether the key's own height counts as "definite" for percentage
        // resolution on an absolutely positioned child.
        fillEl.style.height = Math.round(pct * keyEl.clientHeight) + 'px';

        // Brief splash on the surface line, then it settles still — retrigger
        // the animation even if it's already mid-splash from a moment ago.
        fillEl.classList.remove('pouring');
        void fillEl.offsetWidth;
        fillEl.classList.add('pouring');
        clearTimeout(fillEl._pourTimeout);
        fillEl._pourTimeout = setTimeout(() => fillEl.classList.remove('pouring'), 900);
    }

    // Starting the song over should start the results over too — otherwise
    // a key already "full" from the last attempt stays full forever, which
    // stops meaning anything.
    function resetKeyFills() {
        Object.keys(songNoteCorrect).forEach(note => { delete songNoteCorrect[note]; });
        Object.values(keyFillEls).forEach(el => {
            el.classList.remove('pouring');
            el.style.height = '0px';
        });
    }

    const NOTE_LEAD = 0.6;
    const NOTE_TAIL = 0.45;
    let songIdx = 0;
    let songHit = false;
    const keyByNote = {};

    const characterImages = ["דו.png", "רה.png", "מי.png", "פה.png", "סול.png", "לה.png", "סי.png"];

    // Map every note to its real recorded sample (24 files exist in sounds/,
    // the previous version only wired up 4 of them and let Tone.js pitch-shift the rest).
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    // Single octave: this song doesn't need the range of a second one, and
    // one octave keeps the correct-key feedback unambiguous (matches the
    // pattern used for the other calibrated lessons).
    const octaves = [4];

    function noteToFile(note, octave) {
        const letter = note[0].toLowerCase();
        const sharp = note.includes('#') ? 'd' : '';
        return `sounds/${letter}${sharp}${octave}.wav`;
    }

    // sounds/d4.wav and sounds/e4.wav actually contain mislabeled D3/E3 audio
    // (a leftover export mistake, not something the recording session did wrong).
    // Skip them so Tone.Sampler falls back to pitch-shifting from the nearest
    // good sample (the same behavior the original piano already relies on).
    const knownBadSamples = new Set(['D4', 'E4']);

    const sampleUrls = {};
    octaves.forEach(octave => {
        notes.forEach(note => {
            const fullNote = note + octave;
            if (knownBadSamples.has(fullNote)) return;
            sampleUrls[fullNote] = noteToFile(note, octave);
        });
    });

    // Shared raw Web Audio context (Tone.js's own) so the synthesized extra
    // instruments (organ/guitar/flute/drums) and the real piano samples all
    // pass through one master volume knob instead of being wired separately.
    const audioCtx = Tone.getContext().rawContext;
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);

    // A subtle reverb gives the notes a gentle "sustain pedal" quality —
    // like they keep resonating in the room rather than stopping dead.
    const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.32 }).connect(masterGain);

    const sampler = new Tone.Sampler({
        urls: sampleUrls,
        baseUrl: "./",
        // A real piano note keeps ringing for a while after the key is released.
        // The default release (~0.1s) cut notes off almost the instant a child
        // lifted their finger, especially on quick taps. 2.2s lets it fade out naturally.
        attack: 0.005,
        release: 2.2,
        onload: () => console.log("Sounds loaded!"),
        onerror: (e) => console.log("Error loading sound", e)
    }).connect(reverb);

    // --- Extra instruments (organ/guitar/flute/drums) — synthesized, since
    // we only have real recordings for the piano. "piano" mode keeps using
    // the Tone.Sampler above untouched; everything else routes here.
    let currentMode = 'piano';
    const synthActive = new Map();

    function noteNameToFreq(name) {
        const idx = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
        const m = name.match(/^([A-G]#?)(\d)$/);
        const midi = (parseInt(m[2], 10) + 1) * 12 + idx[m[1]];
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function makeNoiseBuffer(duration) {
        const size = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
        const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
        return buffer;
    }

    function drumNoise(now, opts) {
        const src = audioCtx.createBufferSource();
        src.buffer = makeNoiseBuffer(opts.decay + 0.05);
        const filter = audioCtx.createBiquadFilter();
        filter.type = opts.filterType || 'highpass';
        filter.frequency.value = opts.freq || 4000;
        if (opts.q) filter.Q.value = opts.q;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(opts.vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + opts.decay);
        src.connect(filter); filter.connect(g); g.connect(masterGain);
        src.start(now);
    }

    function drumTone(now, opts) {
        const osc = audioCtx.createOscillator();
        osc.type = opts.type || 'sine';
        osc.frequency.setValueAtTime(opts.startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.endFreq), now + opts.pitchDecay);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(opts.vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + opts.decay);
        osc.connect(g); g.connect(masterGain);
        osc.start(now); osc.stop(now + opts.decay + 0.05);
    }

    function playDrum(name) {
        const now = audioCtx.currentTime;
        switch (name) {
            case 'kick': return drumTone(now, { type: 'sine', startFreq: 150, endFreq: 40, pitchDecay: 0.12, decay: 0.35, vol: 1 });
            case 'snare':
                drumNoise(now, { filterType: 'bandpass', freq: 1800, q: 0.7, decay: 0.18, vol: 0.9 });
                return drumTone(now, { type: 'triangle', startFreq: 200, endFreq: 120, pitchDecay: 0.05, decay: 0.12, vol: 0.5 });
            case 'closedhat': return drumNoise(now, { filterType: 'highpass', freq: 7000, decay: 0.06, vol: 0.6 });
            case 'openhat': return drumNoise(now, { filterType: 'highpass', freq: 6000, decay: 0.35, vol: 0.5 });
            case 'tom-low': return drumTone(now, { type: 'sine', startFreq: 140, endFreq: 90, pitchDecay: 0.1, decay: 0.3, vol: 0.9 });
            case 'tom-mid': return drumTone(now, { type: 'sine', startFreq: 190, endFreq: 120, pitchDecay: 0.1, decay: 0.28, vol: 0.9 });
            case 'tom-hi': return drumTone(now, { type: 'sine', startFreq: 260, endFreq: 160, pitchDecay: 0.09, decay: 0.24, vol: 0.9 });
            case 'clap':
                drumNoise(now, { filterType: 'bandpass', freq: 1500, q: 1.2, decay: 0.08, vol: 0.8 });
                return drumNoise(now + 0.02, { filterType: 'bandpass', freq: 1500, q: 1.2, decay: 0.15, vol: 0.8 });
            case 'rim': return drumTone(now, { type: 'square', startFreq: 900, endFreq: 850, pitchDecay: 0.02, decay: 0.06, vol: 0.4 });
            case 'shaker': return drumNoise(now, { filterType: 'highpass', freq: 5000, decay: 0.12, vol: 0.35 });
            case 'conga': return drumTone(now, { type: 'sine', startFreq: 380, endFreq: 210, pitchDecay: 0.05, decay: 0.2, vol: 0.85 });
            case 'crash': return drumNoise(now, { filterType: 'highpass', freq: 5000, decay: 0.9, vol: 0.45 });
        }
    }

    function synthNoteOn(key, freq) {
        const now = audioCtx.currentTime;
        const gain = audioCtx.createGain();
        const nodes = [];

        if (currentMode === 'guitar') {
            gain.connect(masterGain);
            [{ n: 1, vol: 0.5, decay: 1.05 }, { n: 2, vol: 0.32, decay: 0.75 }, { n: 3, vol: 0.19, decay: 0.55 },
             { n: 4, vol: 0.11, decay: 0.4 }, { n: 5, vol: 0.06, decay: 0.28 }].forEach(function (h) {
                const osc = audioCtx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.value = freq * h.n;
                const hg = audioCtx.createGain();
                hg.gain.setValueAtTime(0, now);
                hg.gain.linearRampToValueAtTime(h.vol, now + 0.003);
                hg.gain.exponentialRampToValueAtTime(0.0006, now + h.decay);
                osc.connect(hg); hg.connect(gain);
                osc.start(now); osc.stop(now + h.decay + 0.1);
                nodes.push(osc);
            });
            const sub = audioCtx.createOscillator();
            sub.type = 'sine'; sub.frequency.value = freq / 2;
            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(0, now);
            subGain.gain.linearRampToValueAtTime(0.18, now + 0.005);
            subGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.85);
            sub.connect(subGain); subGain.connect(gain);
            sub.start(now); sub.stop(now + 0.9);
            nodes.push(sub);
            const pick = audioCtx.createBufferSource();
            pick.buffer = makeNoiseBuffer(0.02);
            const pickFilter = audioCtx.createBiquadFilter();
            pickFilter.type = 'highpass'; pickFilter.frequency.value = 2200;
            const pickGain = audioCtx.createGain();
            pickGain.gain.setValueAtTime(0.32, now);
            pickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
            pick.connect(pickFilter); pickFilter.connect(pickGain); pickGain.connect(gain);
            pick.start(now);
            nodes.push(pick);
            gain.gain.value = 1;

        } else if (currentMode === 'flute') {
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = 2400; filter.Q.value = 0.3;
            filter.connect(gain); gain.connect(masterGain);

            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine'; lfo.frequency.value = 4.5;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 2.4;
            lfo.connect(lfoGain); lfo.start(now);
            nodes.push(lfo);

            [{ n: 1, vol: 0.30 }, { n: 2, vol: 0.05 }].forEach(function (h) {
                const osc = audioCtx.createOscillator();
                osc.type = 'sine'; osc.frequency.value = freq * h.n;
                lfoGain.connect(osc.frequency);
                const hg = audioCtx.createGain();
                hg.gain.value = h.vol;
                osc.connect(hg); hg.connect(filter);
                osc.start(now);
                nodes.push(osc);
            });

            const breath = audioCtx.createBufferSource();
            breath.buffer = makeNoiseBuffer(2); breath.loop = true;
            const breathFilter = audioCtx.createBiquadFilter();
            breathFilter.type = 'bandpass'; breathFilter.frequency.value = freq * 1.5; breathFilter.Q.value = 1.4;
            const breathGain = audioCtx.createGain();
            breathGain.gain.value = 0.04;
            breath.connect(breathFilter); breathFilter.connect(breathGain); breathGain.connect(filter);
            breath.start(now);
            nodes.push(breath);

            const chiff = audioCtx.createBufferSource();
            chiff.buffer = makeNoiseBuffer(0.05);
            const chiffFilter = audioCtx.createBiquadFilter();
            chiffFilter.type = 'bandpass'; chiffFilter.frequency.value = freq * 1.8; chiffFilter.Q.value = 1.2;
            const chiffGain = audioCtx.createGain();
            chiffGain.gain.setValueAtTime(0.12, now);
            chiffGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.05);
            chiff.connect(chiffFilter); chiffFilter.connect(chiffGain); chiffGain.connect(filter);
            chiff.start(now);
            nodes.push(chiff);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(1.05, now + 0.08);

        } else {
            // Organ: what used to be the piano's own engine — two
            // slightly-detuned triangle oscillators through a filter that
            // opens briefly then settles into a steady sustain tone.
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(4200, now);
            filter.frequency.exponentialRampToValueAtTime(1500, now + 0.45);
            filter.Q.value = 0.3;
            filter.connect(gain); gain.connect(masterGain);

            [-3, 3].forEach(function (cents, i) {
                const osc = audioCtx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.value = freq * Math.pow(2, cents / 1200);
                const og = audioCtx.createGain();
                og.gain.value = i === 0 ? 0.22 : 0.18;
                osc.connect(og); og.connect(filter);
                osc.start(now);
                nodes.push(osc);
            });

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(1, now + 0.02);
        }
        synthActive.set(key, { nodes: nodes, gain: gain });
    }

    const synthSustainModes = ['organ', 'flute'];

    function synthNoteOff(key) {
        const active = synthActive.get(key);
        if (!active) return;
        if (synthSustainModes.indexOf(currentMode) !== -1) {
            const now = audioCtx.currentTime;
            active.gain.gain.cancelScheduledValues(now);
            active.gain.gain.setValueAtTime(active.gain.gain.value, now);
            active.gain.gain.linearRampToValueAtTime(0, now + 0.1);
            active.nodes.forEach(function (o) { try { o.stop(now + 0.12); } catch (e) {} });
        }
        synthActive.delete(key);
    }

    // Single octave, 12 keys — a fixed drum-kit layout for "תופים" mode,
    // in key order (C, C#, D, D#, E, F, F#, G, G#, A, A#, B).
    const drumKit = ['kick', 'closedhat', 'snare', 'openhat', 'tom-low', 'tom-mid', 'tom-hi', 'clap', 'rim', 'shaker', 'conga', 'crash'];
    let whiteKeyIndex = 0;
    let keyIndex = 0;

    octaves.forEach(octave => {
        notes.forEach(note => {
            const isBlack = note.includes('#');
            const fullNote = note + octave;
            const freq = noteNameToFreq(fullNote);
            const drumSound = drumKit[keyIndex];
            keyIndex++;
            const key = document.createElement('div');
            key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
            key.dataset.note = fullNote;
            key.dataset.isPlaying = "false";
            keyByNote[fullNote] = key;

            if (songNoteTotals[fullNote]) {
                const fillEl = document.createElement('div');
                fillEl.className = 'key-fill';
                key.appendChild(fillEl);
                keyFillEls[fullNote] = fillEl;
            }

            if (!isBlack) {
                const img = document.createElement('img');
                img.src = characterImages[whiteKeyIndex] || "";
                img.className = 'character-img';
                key.appendChild(img);
                whiteKeyIndex++;
            }

            const playNote = () => {
                if (key.dataset.isPlaying === "true") return;
                key.dataset.isPlaying = "true";
                key.classList.add('active');
                if (mode === 'practice') dismissPracticeHint();

                if (currentMode === 'piano') {
                    try { sampler.triggerAttack(fullNote); } catch (err) {}
                } else if (currentMode === 'drums') {
                    playDrum(drumSound);
                } else {
                    synthNoteOn(key, freq);
                }

                if (soloMode) {
                    // Self-paced: "correct" just means "the right next note
                    // in the sequence," with no clock involved at all.
                    if (soloIdx < songNotes.length && fullNote === songNotes[soloIdx].note) {
                        // עכשיו גם אורך התו נחשב, לא רק איזה תו נלחץ
                        if (songNotes[soloIdx].hold) startHold(soloIdx, key);
                        else completeSoloNote(soloIdx, key);
                    }
                } else if (!songHit && songIdx < songNotes.length && player && player.getCurrentTime) {
                    // Feedback runs in both modes now — Hani's own narration in
                    // the lesson video tells the child to press the key the
                    // moment a character reaches the video's green line, so
                    // "watch" was never meant to mean "don't play." Only the
                    // falling-note lane and mini-video are practice-only.
                    const cur = songNotes[songIdx];
                    if (fullNote === cur.note) {
                        const t = player.getCurrentTime();
                        if (t >= cur.time - NOTE_LEAD && t <= cur.time + NOTE_TAIL) {
                            songHit = true;
                            markTileHit(songIdx);
                            fillKey(fullNote);
                            key.classList.add('correct-flash');
                            const star = document.createElement('div');
                            star.className = 'star-pop';
                            star.textContent = '⭐';
                            key.appendChild(star);
                            setTimeout(() => {
                                key.classList.remove('correct-flash');
                                star.remove();
                            }, 550);
                        }
                    }
                }
            };

            const stopNote = () => {
                if (key.dataset.isPlaying === "false") return;
                key.dataset.isPlaying = "false";
                key.classList.remove('active');
                releaseHold(key);
                if (currentMode === 'piano') {
                    try { sampler.triggerRelease(fullNote); } catch (err) {}
                } else if (currentMode !== 'drums') {
                    synthNoteOff(key);
                }
            };

            let isTouchActive = false;

            key.addEventListener('pointerdown', () => {
                if (isTouchActive) return;
                isTouchActive = true;
                playNote();
            });
            key.addEventListener('pointermove', (e) => e.preventDefault());
            key.addEventListener('pointerup', () => { isTouchActive = false; stopNote(); });
            key.addEventListener('pointerleave', () => { isTouchActive = false; stopNote(); });
            key.addEventListener('pointercancel', () => { isTouchActive = false; stopNote(); });

            pianoElement.appendChild(key);
        });
    });

    // --- Falling-note lane (pilot): one column per white key, in the same
    // do-re-mi-fa-sol-la-si order the keys themselves are built in, so a
    // note's column always lines up with the key it belongs to.
    const noteLetterOrder = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
    const laneCols = {};
    noteLetterOrder.forEach((letter) => {
        const col = document.createElement('div');
        col.className = 'note-lane-col';
        laneCols[letter] = col;
        noteLane.appendChild(col);
    });
    const hitLine = document.createElement('div');
    hitLine.id = 'note-lane-hitline';
    noteLane.appendChild(hitLine);

    // How far ahead (in seconds) a note appears at the top of the lane
    // before its own moment arrives at the hit-line — the anticipation
    // window that replaces having to glance up at the video to see what's
    // coming next.
    const FALL_DURATION = 2.4;
    const activeTiles = new Map(); // songNotes index -> tile element

    function renderFallingLane(t) {
        if (mode !== 'practice' || soloMode) return;
        const laneH = noteLane.clientHeight;
        if (!laneH) return;
        // Lands so the tile's own bottom edge meets the hit-line, not its top.
        const whiteWpx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--white-w')) || 0;
        const tileSize = whiteWpx * 0.6;
        const landTop = Math.max(0, laneH - tileSize);
        // Past the line, progress keeps climbing above 1 (no upper clamp).
        // Fade it out smoothly over that stretch so it dissolves before it
        // would otherwise get abruptly clipped by the lane's own edge —
        // that clip was the "flicker right before it disappears."
        const progressCutoff = 1 + (NOTE_TAIL + 0.3) / FALL_DURATION;
        songNotes.forEach((n, i) => {
            const letter = n.note[0];
            const col = laneCols[letter];
            if (!col) return;
            const timeUntil = n.time - t;
            const visible = timeUntil <= FALL_DURATION && timeUntil >= -(NOTE_TAIL + 0.3);
            let tile = activeTiles.get(i);
            if (visible) {
                if (!tile) {
                    // Always centered — same-letter notes close together in
                    // time fall in the same spot, on purpose (their spacing
                    // comes from timing, not from being nudged sideways).
                    tile = document.createElement('div');
                    tile.className = 'falling-note';
                    const img = document.createElement('img');
                    img.src = characterImages[noteLetterOrder.indexOf(letter)] || '';
                    tile.appendChild(img);
                    col.appendChild(tile);
                    activeTiles.set(i, tile);
                }
                // Only a correct hit freezes it (it's popping and vanishing
                // via its own animation). A missed note keeps sinking all
                // the way down and off — falling past the line is what
                // "too late" looks like, rather than hovering there fading.
                if (!tile.classList.contains('hit')) {
                    const progress = Math.max(0, 1 - timeUntil / FALL_DURATION);
                    tile.style.top = (progress * landTop) + 'px';
                    if (progress > 1) {
                        const fade = Math.min(1, (progress - 1) / (progressCutoff - 1));
                        tile.style.opacity = String(Math.max(0, 1 - fade));
                    }
                }
            } else if (tile) {
                tile.remove();
                activeTiles.delete(i);
            }
        });
    }

    function markTileHit(index) {
        const tile = activeTiles.get(index);
        if (!tile) return;
        tile.classList.add('hit');
        activeTiles.delete(index);
        setTimeout(() => tile.remove(), 300);
    }


    (function fallLoop() {
        if (player && player.getCurrentTime) renderFallingLane(player.getCurrentTime());
        requestAnimationFrame(fallLoop);
    })();

    // Responsive key sizing: fit 7 white keys to the width left over after
    // cabinet chrome. Width has no low cap — on a big screen the piano is
    // meant to look like a real, prominent instrument, not a small widget
    // lost in empty space. Key height is derived from key width (not a
    // fixed vh) so proportions stay realistic at any size, and the whole
    // cabinet is capped by available vertical space so it never crowds
    // the video out on a short window.
    function sizeKeys() {
        const totalWhiteKeys = 7;
        const reserved = 40;
        const rawWidth = Math.min(pianoContainer.clientWidth, window.innerWidth);
        const containerWidth = Math.max(220, rawWidth - reserved);

        let whiteW = Math.floor(containerWidth / totalWhiteKeys);
        whiteW = Math.max(24, Math.min(whiteW, 150));

        // Split the space left after the speed bar/chrome roughly evenly
        // between video and piano — but never let the piano take so much
        // height that the video area's aspect ratio goes far past 16:9.
        // On a wide-but-short window, giving the piano a flat 50% used to
        // squeeze the video into a sliver, which YouTube then pillarboxes
        // (black bars on the sides) since it keeps the video's real aspect.
        // +46 over the other song pages' chromeH, for this pilot's extra
        // watch/practice mode-bar row.
        const chromeH = 176;

        let laneH = 0;
        let availableH, maxKeyH;
        if (mode === 'practice') {
            // This lesson has no visible video (see #video-wrap.mini above) —
            // just a 2px sliver kept alive for its audio — so almost none of
            // the window height needs to be reserved for it.
            // No 320px floor here on purpose — on a short landscape phone
            // screen that floor used to claim more height than actually
            // exists, pushing the piano/staff below the visible viewport
            // instead of shrinking to fit it.
            availableH = Math.max(160, window.innerHeight - chromeH - 2);
            // Keys get first claim on the space and a real floor — a small
            // phone in landscape is exactly when keys most need to stay
            // tappable — but the lane still needs enough room that its own
            // note circles (sized off key width, which stays generous on a
            // wide landscape screen) don't get clipped inside it.
            maxKeyH = Math.max(125, Math.min(220, availableH - 55));
            const idealLaneH = Math.max(55, Math.min(150, Math.round(whiteW * 2.1)));
            laneH = Math.max(55, Math.min(idealLaneH, availableH - maxKeyH));
        } else {
            availableH = Math.max(320, window.innerHeight - chromeH);
            // Standing rule across every song page: video gets ~45% of the
            // available height, piano gets ~55% — a fixed split kept
            // consistent site-to-site.
            maxKeyH = Math.max(160, availableH * 0.55);
        }

        let keyH = whiteW * 3.2;
        if (keyH > maxKeyH) {
            keyH = maxKeyH;
            whiteW = Math.max(24, Math.floor(keyH / 3.2));
        }

        const blackW = Math.round(whiteW * 0.495);

        document.documentElement.style.setProperty('--white-w', whiteW + 'px');
        document.documentElement.style.setProperty('--black-w', blackW + 'px');
        document.documentElement.style.setProperty('--key-h', keyH + 'px');
        document.documentElement.style.setProperty('--lane-h', laneH + 'px');
        document.documentElement.style.setProperty('--staff-h', laneH + 'px');
    }
    window.addEventListener('resize', () => { sizeKeys(); if (soloMode) buildStaff(); });
    sizeKeys();
    // Re-measure once layout has fully settled — an initial synchronous call
    // can occasionally read a stale/incorrect container width before the
    // viewport is fully applied.
    window.addEventListener('load', sizeKeys);
    requestAnimationFrame(sizeKeys);
    setTimeout(sizeKeys, 400);
    setTimeout(sizeKeys, 1200);

    // Polls playback time and advances past notes once their window closes
    // — no penalty, it just moves on. The green key-outline and the falling
    // tile are both practice-mode-only: in watch mode nothing is being
    // graded, so nothing should look like it's demanding a correct key.
    setInterval(() => {
        // This loop drives the timed-practice due-highlight/songIdx off the
        // (possibly paused) player clock — without this guard it kept
        // running under "לנסות לבד" too, and since pausing freezes time
        // rather than stopping the interval, it would re-apply a stale
        // "due" highlight moments after solo mode had just cleared it.
        if (soloMode) return;
        if (!player || !player.getCurrentTime || songIdx >= songNotes.length) return;
        const t = player.getCurrentTime();
        const cur = songNotes[songIdx];
        const keyEl = keyByNote[cur.note];
        const inWindow = t >= cur.time - NOTE_LEAD && t <= cur.time + NOTE_TAIL;

        if (keyEl) keyEl.classList.toggle('due', inWindow);

        if (t > cur.time + NOTE_TAIL) {
            if (keyEl) keyEl.classList.remove('due');
            songIdx++;
            songHit = false;
        }
    }, 100);

    // Pilot: instrument switcher UI is hidden, so currentMode stays 'piano'
    // (the real Tone.Sampler) — this keeps the focus on the falling-note
    // lane itself rather than on choosing sounds.

    // No watch-along video for this song — always opens straight into
    // practice mode, no toggle needed.
    setMode('practice');
</script>
